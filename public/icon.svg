<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- アダマス工房のアイコン。
       「アダマス（ἀδάμας）＝ダイヤモンド／鋼」に由来するので、ブリリアントカットの
       ダイヤを真上から見た形（テーブル面＋クラウンのファセット）を据えている。
       tools/gen-icons で各サイズのPNGを生成するため、content マーカーは動かさないこと。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212b38"/><stop offset="100%" stop-color="#0d1015"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#40608a"/><stop offset="100%" stop-color="#141920" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#b8d3ec"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ec0e0"/><stop offset="100%" stop-color="#5b81a9"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#33506f"/><stop offset="100%" stop-color="#6f95bb"/>
    </linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d9ecff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d98a"/><stop offset="100%" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- content:start -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <g stroke="#0d1218" stroke-width="7" stroke-linejoin="round">
    <polygon points="256,66 390,121 445,256 390,391 256,446 122,391 67,256 122,121" fill="url(#f2)"/>
    <polygon points="256,66 390,121 322,186 256,152" fill="url(#f1)"/>
    <polygon points="390,121 445,256 356,256 322,186" fill="url(#f3)"/>
    <polygon points="445,256 390,391 322,326 356,256" fill="url(#f2)"/>
    <polygon points="390,391 256,446 256,360 322,326" fill="url(#f3)"/>
    <polygon points="256,446 122,391 190,326 256,360" fill="url(#f1)"/>
    <polygon points="122,391 67,256 156,256 190,326" fill="url(#f2)"/>
    <polygon points="67,256 122,121 190,186 156,256" fill="url(#f3)"/>
    <polygon points="122,121 256,66 256,152 190,186" fill="url(#f2)"/>
    <polygon points="256,152 322,186 356,256 322,326 256,360 190,326 156,256 190,186" fill="url(#tbl)"/>
  </g>
  <g stroke="#7fa8cf" stroke-width="3.5" opacity="0.8" fill="none" stroke-linejoin="round">
    <polygon points="256,152 356,256 256,360 156,256"/>
  </g>
  <path d="M139 112 l11 26 26 11 -26 11 -11 26 -11 -26 -26 -11 26 -11 z" fill="#ffffff" opacity="0.95"/>
  <path d="M404 336 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 z" fill="url(#gold)"/>
  <!-- content:end -->
</svg>
