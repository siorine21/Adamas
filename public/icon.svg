<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- アダマス工房のアイコン。
       「アダマス（ἀδάμας）＝ダイヤモンド／鋼」に由来するので、ブリリアントカットの
       ダイヤを主役に据え、背面に鋼の六角プレート（＝工房・はがね統一）を薄く敷く。
       tools/gen-icons で各サイズのPNGを生成するため、下の content マーカーは動かさないこと。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212b38"/><stop offset="100%" stop-color="#0d1015"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#3d5878"/><stop offset="100%" stop-color="#141920" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crownL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cfe2f5"/>
    </linearGradient>
    <linearGradient id="crownM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f3ff"/><stop offset="100%" stop-color="#a9c6e2"/>
    </linearGradient>
    <linearGradient id="pavL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe2f5"/><stop offset="100%" stop-color="#7fa8cf"/>
    </linearGradient>
    <linearGradient id="pavM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dbdda"/><stop offset="100%" stop-color="#4d6c8e"/>
    </linearGradient>
    <linearGradient id="pavR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f93b8"/><stop offset="100%" stop-color="#3b5878"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d98a"/><stop offset="100%" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- content:start -->
  <ellipse cx="256" cy="250" rx="205" ry="190" fill="url(#glow)"/>
  <!-- 背面: 鋼の六角プレート（枠とリベットだけ残した控えめな表現） -->
  <polygon points="256,66 420,161 420,351 256,446 92,351 92,161"
           fill="none" stroke="#54687e" stroke-width="9" stroke-linejoin="round" opacity="0.6"/>
  <g fill="#54687e" opacity="0.6">
    <circle cx="256" cy="92" r="8"/><circle cx="396" cy="175" r="8"/><circle cx="396" cy="337" r="8"/>
    <circle cx="256" cy="420" r="8"/><circle cx="116" cy="337" r="8"/><circle cx="116" cy="175" r="8"/>
  </g>
  <!-- 主役: ブリリアントカットのダイヤ（クラウン＋パビリオン） -->
  <g stroke="#0f141a" stroke-width="6" stroke-linejoin="round">
    <polygon points="176,150 336,150 372,214 140,214" fill="url(#crownM)"/>
    <polygon points="176,150 336,150 300,214 212,214" fill="url(#crownL)"/>
    <polygon points="140,214 212,214 256,404" fill="url(#pavL)"/>
    <polygon points="212,214 300,214 256,404" fill="url(#pavM)"/>
    <polygon points="300,214 372,214 256,404" fill="url(#pavR)"/>
  </g>
  <line x1="140" y1="214" x2="372" y2="214" stroke="#ffffff" stroke-width="5" opacity="0.55"/>
  <!-- きらめき -->
  <path d="M150 116 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10 z" fill="#ffffff" opacity="0.92"/>
  <path d="M378 292 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 z" fill="url(#gold)"/>
  <!-- content:end -->
</svg>
