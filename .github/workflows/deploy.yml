name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-pages ブランチへ push するため contents:write のみ必要
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # GitHub Pages のプロジェクトサイトはリポジトリ名のサブパスで配信される
          VITE_BASE: /Adamas/
      - name: Publish to gh-pages branch
        run: |
          cd dist
          touch .nojekyll               # Jekyll 処理を無効化（Vite の assets をそのまま配信）
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
