name: Scrape Champ Learnsets

# 手動起動のみ。開発環境からは攻略サイトへ直接アクセスできないため、
# ランナーから取得して結果をブランチに出す（レビューしてから main へ）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (ad-hoc, not saved to package.json)
        run: |
          npm i --no-save playwright@1.49
          npx playwright install --with-deps chromium
      - name: Fetch pages
        run: node tools/fetch-pages/fetch.cjs
      - name: Push result branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/regulation-mc
          git add -f tools/fetch-pages/out
          git commit -q -m "chore: fetch regulation pages" || echo "no changes"
          git push -f origin bot/regulation-mc
