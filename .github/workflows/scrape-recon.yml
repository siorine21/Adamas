name: Champ Scrape Recon

on:
  push:
    branches: [tooling/champ-scrape]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/champ-scrape
      - name: Run scrape recon script
        run: |
          python3 recon/scrape.py || echo "script error"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recon/map.txt recon/struct.txt recon/ctx.txt 2>/dev/null
          git commit -q -m "recon map+struct" || echo "nothing to commit"
          git push origin HEAD:tooling/champ-scrape || echo "push failed"
