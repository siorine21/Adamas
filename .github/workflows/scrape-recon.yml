name: Champ Scrape Recon

on:
  push:
    branches: [tooling/champ-scrape]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/champ-scrape
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright recon on yakkun
        run: |
          npm i -D playwright@1.49 >/dev/null 2>&1 || npm i -D playwright
          npx playwright install --with-deps chromium
          node recon/pw.js || echo "node error"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recon/yakkun.txt 2>/dev/null
          git commit -q -m "yakkun playwright recon" || echo "nothing to commit"
          git push origin HEAD:tooling/champ-scrape || echo "push failed"
