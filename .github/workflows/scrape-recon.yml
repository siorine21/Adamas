name: Champ Scrape Recon

on:
  push:
    branches: [tooling/champ-scrape]
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AppMedia robots + steel list links + one pokemon page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "===== AppMedia robots.txt ====="
          curl -s -A "$UA" --max-time 25 "https://appmedia.jp/robots.txt" | head -40
          echo ""
          echo "===== GameWith robots.txt ====="
          curl -s -A "$UA" --max-time 25 "https://gamewith.jp/robots.txt" | head -40
          sleep 2
          echo ""
          echo "===== AppMedia はがねタイプ一覧(79917367) の個別ページリンク ====="
          curl -s -A "$UA" --max-time 25 "https://appmedia.jp/pokemonchampions/79917367" -o /tmp/list.html || true
          echo "size: $(wc -c </tmp/list.html)"
          # /pokemonchampions/数字 へのリンクとアンカーテキストを抽出
          grep -oiE '<a[^>]*href="https://appmedia.jp/pokemonchampions/[0-9]+"[^>]*>[^<]+</a>' /tmp/list.html \
            | sed -E 's/.*pokemonchampions\/([0-9]+)".*>([^<]+)<.*/\1\t\2/' | grep -E 'ボスゴドラ|ハガネール|メタグロス|ギルガルド|サーフゴー|ブリジュラス|ドドゲザン|アーマーガア|エアームド|クチート' | head -30
          echo "--- (fallback) ボスゴドラ 近傍のリンク ---"
          grep -oiE 'pokemonchampions/[0-9]+"[^>]*>ボスゴドラ' /tmp/list.html | head -5
